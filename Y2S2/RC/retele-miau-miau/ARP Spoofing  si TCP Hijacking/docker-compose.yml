services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: retele-miau-miau-main-server-1
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ..:/elocal
    ports:
      - "53535:53/udp"
    networks:
      net2:
        ipv4_address: 198.7.0.2

    command: bash -c "sleep infinity"
    tty: true
    stdin_open: true

  middle:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: retele-miau-miau-main-middle-1
    volumes:
      - ..:/elocal
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    networks:
      net2:
        ipv4_address: 198.7.0.3
      net1:
        ipv4_address: 172.7.0.3

    depends_on:
      - router
    sysctls:
      - net.ipv4.ip_forward=1
    command: bash -c "/src/middle.sh && sleep infinity"

  router:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: retele-miau-miau-main-router-1
    volumes:
      - ..:/elocal
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    networks:
      net1:
        ipv4_address: 172.7.0.1
      net2:
        ipv4_address: 198.7.0.1
    sysctls:
      - net.ipv4.ip_forward=1
    command: bash -c "/src/router.sh && sleep infinity"

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: retele-miau-miau-main-client-1
    volumes:
      - ..:/elocal
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    networks:
      net1:
        ipv4_address: 172.7.0.2
    depends_on:
      - router
      - server
    command: bash -c "/src/client.sh && sleep infinity"

networks:
  net1:
    ipam:
      driver: default
      config:
        - subnet: 172.7.0.0/16
          gateway: 172.7.1.1

  net2:
    ipam:
      driver: default
      config:
        - subnet: 198.7.0.0/16
          gateway: 198.7.1.1

  dnsnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
