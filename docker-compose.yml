version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dns_blocker
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./src/dns_blocker:/app
      - ./src/dns_blocker/files:/app/files
    ports:
      - "55555:53/udp"
    networks:
      dnsnet:
        ipv4_address: 172.31.0.53
    command: bash -c "python3 /app/dns_blocker.py"
    tty: true
    stdin_open: true

  middle:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/elocal
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    networks:
      net1:
        ipv4_address: 172.7.0.3
      net2:
        ipv4_address: 198.7.0.3
    depends_on:
      - router
    sysctls:
      - net.ipv4.ip_forward=1
    command: bash -c "/scripts/middle.sh && sleep infinity"

  router:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: retele-miau-miau-router-1
    volumes:
      - ..:/elocal
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    networks:
      net1:
        ipv4_address: 172.7.0.1
      net2:
        ipv4_address: 198.7.0.1
      dnsnet: 
        ipv4_address: 172.31.0.2
    sysctls:
      - net.ipv4.ip_forward=1
    command: bash -c "/scripts/router.sh && sleep infinity"

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./src/dns_client:/app/client_code # NOU: pentru a accesa dns_client.py
      - ./client_data:/data
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    networks:
      net1:
        ipv4_address: 172.7.0.2
    depends_on:
      - router
      - server
    command: bash -c "/scripts/client.sh && python3 /app/client_code/dns_client.py && sleep infinity" # NOU: ruleaza clientul

networks:
  net1:
    ipam:
      driver: default
      config:
        - subnet: 172.7.0.0/16
          gateway: 172.7.0.254

  net2:
    ipam:
      driver: default
      config:
        - subnet: 198.7.0.0/16
          gateway: 198.7.1.1

  dnsnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
